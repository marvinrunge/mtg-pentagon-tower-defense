name: Publish website

# Deploys site/ to GitHub Pages. Only that folder is published, so docs/ and the rest of
# the repo never become public through the site.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# On a private repo, Pages needs a paid plan (Pro/Team), and the site itself is PUBLIC.
on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
